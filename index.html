<header class="top">

<script>
/* ===== Noyau de calcul (testable sous Node) ===== */
const r2 = v => Math.round((v + Math.sign(v) * 1e-9) * 100) / 100;
/* Règle des modèles ELLIPSE : SI(C>1 ; ARRONDI.SUP(C-1;3) ; ARRONDI.INF(C-1;3)) = arrondi au millième vers +∞ */
const ceil3 = x => Math.ceil(x * 1000 - 1e-7) / 1000;
const num = v => (v === '' || v == null || isNaN(v)) ? 0 : +v;

function addMonths(ym, k) {
  if (!ym) return '';
  let [y, m] = ym.split('-').map(Number);
  m += k; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; }
  return y + '-' + String(m).padStart(2, '0');
}

/* Coefficient brut C et variation arrondie x = C-1 */
/* mois d'index d'un décompte : d − décalage, ou (révision annuelle d'accord-cadre) mois anniversaire de la notification ; '' = 1re année, pas de révision */
function moisIdx(a, d) { const P = a.prix || {};
  if (P.annuelle) { const n = a.dateNotif, b = a.dateBC || (d && d.mois ? d.mois + '-01' : ''); if (!n || !b) return null;
    let m = (+b.slice(0, 4) - +n.slice(0, 4)) * 12 + (+b.slice(5, 7) - +n.slice(5, 7)); if (+b.slice(8, 10) < +n.slice(8, 10)) m--;
    const y = Math.floor(m / 12); return y < 1 ? '' : addMonths(n.slice(0, 7), 12 * y); }
  return d && d.mois ? addMonths(d.mois, -num(P.decalage)) : null; }
function coefficient(prix, idx) {
  const t = prix.termes || [];
  if (!t.length) return null;
  let s = 0, sc = 0;
  for (const k of t) {
    const i0 = num(k.i0), i = num(idx && idx[k.nom]);
    if (!i0 || !i) return null;
    s += num(k.coef) * i / i0; sc += num(k.coef);
  }
  const fixe = num(prix.fixe);
  const C = fixe + (1 - fixe) * s;
  return { C, x: ceil3(C - 1), sommeCoef: sc };
}

/* Valeurs cumulées dérivées des montants primaires {base, rev, pen, remb} */
function deriver(a, prim) {
  const tva = num(a.tva) / 100, rg = num(a.rg) / 100;
  const ints = a.intervenants, tit = ints.find(i => i.type === 'titulaire') || ints[0];
  const out = {}; let autoliq = 0;
  ints.forEach(i => {
    const p = prim[i.id] || {};
    const base = r2(num(p.base)), rev = r2(num(p.rev)), ht = r2(base + rev);
    const auto = i.type !== 'titulaire' && i.type !== 'cot' && !!i.autoliq;
    if (auto) autoliq = r2(autoliq + r2(ht * tva));
    out[i.id] = { base, rev, revPaye: rev, ht, tva: auto ? 0 : r2(ht * tva), tvaBase: auto ? 0 : r2(base * tva), tvaRev: auto ? 0 : r2(rev * tva), auto, autoliq: 0, pen: r2(num(p.pen)), remb: r2(num(p.remb)) };
  });
  out[tit.id].autoliq = autoliq;
  ints.forEach(i => { const L = out[i.id]; L.brut = r2(L.ht + L.tva + L.autoliq); L.rg = r2(L.brut * rg); L.net = r2(L.brut - L.rg - L.pen - L.remb); });
  return out;
}
const CLES = ['base', 'rev', 'revPaye', 'ht', 'tva', 'tvaBase', 'tvaRev', 'autoliq', 'brut', 'rg', 'pen', 'remb', 'net'];
const somme = (ints, o) => { const t = {}; CLES.forEach(k => t[k] = 0); ints.forEach(i => CLES.forEach(k => t[k] = r2(t[k] + (o[i.id][k] || 0)))); return t; };

function calc(a) {
  const ints = a.intervenants, tit = ints.find(i => i.type === 'titulaire') || ints[0];
  const P = a.prix || {};
  let xAct = null;
  let actuSansObjet = false;
  if (P.type === 'actualisation') {
    const mi = ym => { const [y, m] = (ym || '').split('-').map(Number); return y * 12 + m; };
    if (P.mo && P.moisDebut && P.seuilActu !== false && mi(P.moisDebut) - mi(P.mo) <= 3) { actuSansObjet = true; xAct = 0; }
    else { const c = coefficient(P, P.idxDebut); xAct = c ? c.x : null; }
  }
  const out = [], prevCum = {}, cumBase = {}, revBrut = {}; let revTotBrut = 0, certNo = num(a.certDebut) || 1;
  let antPrim = null; // primaires certifiées du décompte précédent
  ints.forEach(i => { cumBase[i.id] = 0; revBrut[i.id] = 0; });
  let penCum = 0;
  a.decomptes.forEach((d, n) => {
    const M = {}; let Mtot = 0;
    ints.forEach(i => {
      const v = d.montants && d.montants[i.id];
      if (a.saisie === 'cumul') { const c = (v === '' || v == null) ? (prevCum[i.id] || 0) : num(v); M[i.id] = r2(c - (prevCum[i.id] || 0)); prevCum[i.id] = c; }
      else M[i.id] = num(v);
      Mtot = r2(Mtot + M[i.id]); cumBase[i.id] = r2(cumBase[i.id] + M[i.id]);
    });
    let x = 0, C = null, manque = false;
    if (P.type === 'revision') { if (P.annuelle && moisIdx(a, d) === '') { x = 0; C = 1; } else { const c = coefficient(P, d.idx); if (c) { x = c.x; C = c.C; } else manque = true; } }
    else if (P.type === 'actualisation') { if (xAct == null) manque = true; else x = xAct; }
    x = x || 0;
    const revMoisBrut = Mtot * x; revTotBrut += revMoisBrut;
    ints.forEach(i => { revBrut[i.id] += M[i.id] * x; });
    // révision cumulée arrondie une seule fois (comme les feuilles de révision)
    const revCum = {}; let sST = 0;
    ints.forEach(i => { if (i !== tit) { revCum[i.id] = r2(revBrut[i.id]); sST = r2(sST + revCum[i.id]); } });
    revCum[tit.id] = r2(r2(revTotBrut) - sST);
    const payeAuSolde = P.type === 'revision' && P.paiement === 'solde';
    const totBase = ints.reduce((s, i) => s + cumBase[i.id], 0);
    penCum = r2(penCum + num(d.penalites));
    let remb = 0;
    if (num(a.avance) && num(a.montantMarche)) {
      const p = totBase / num(a.montantMarche) * 100, d0 = num(a.avDeb), d1 = num(a.avFin);
      remb = r2(num(a.avance) * (1 + num(a.tva) / 100) * Math.min(1, Math.max(0, (p - d0) / Math.max(1e-9, d1 - d0))));
    }
    const prim = {};
    ints.forEach(i => prim[i.id] = { base: cumBase[i.id], rev: payeAuSolde && !d.solde ? (antPrim ? num(antPrim[i.id] && antPrim[i.id].rev) : 0) : revCum[i.id], pen: i === tit ? penCum : 0, remb: i === tit ? remb : 0 });
    const cumCalc = deriver(a, prim);
    // décompte figé : on garde ce qui a été certifié
    const primCert = d.fige && d.fige.prim ? d.fige.prim : prim;
    const cum = d.fige && d.fige.prim ? deriver(a, primCert) : cumCalc;
    const ant = antPrim ? deriver(a, antPrim) : deriver(a, {});
    const lignes = {};
    ints.forEach(i => { const L = {}; CLES.forEach(k => L[k] = r2(cum[i.id][k] - ant[i.id][k])); L.auto = cum[i.id].auto; if (L.ht || L.net) L.cert = certNo++; lignes[i.id] = L; });
    const ecart = d.fige && d.fige.prim ? r2(somme(ints, cumCalc).net - somme(ints, cum).net) : 0;
    out.push({ d, n, x, C, manque, Mtot, M, revTot: r2(revMoisBrut), revMoisBrut, lignes, cum, ant, prim, cumCalc, ecart,
      tot: somme(ints, lignes), cumTot: somme(ints, cum), antTot: somme(ints, ant), moisIdx: moisIdx(a, d) });
    antPrim = primCert;
  });
  return { rows: out, xAct, tit, actuSansObjet };
}

/* Montant en toutes lettres (orthographe traditionnelle) */
const U = ['zéro', 'un', 'deux', 'trois', 'quatre', 'cinq', 'six', 'sept', 'huit', 'neuf', 'dix', 'onze', 'douze', 'treize', 'quatorze', 'quinze', 'seize', 'dix-sept', 'dix-huit', 'dix-neuf'];
const D = ['', 'dix', 'vingt', 'trente', 'quarante', 'cinquante', 'soixante'];
function l99(n, fin) {
  if (n < 20) return U[n];
  const t = Math.floor(n / 10), u = n % 10;
  if (t < 7) return D[t] + (u === 1 ? ' et un' : u ? '-' + U[u] : '');
  if (t === 7) return 'soixante' + (u === 1 ? ' et onze' : '-' + U[10 + u]);
  if (t === 8) return u ? 'quatre-vingt-' + U[u] : 'quatre-vingt' + (fin ? 's' : '');
  return 'quatre-vingt-' + U[10 + u];
}
function l999(n, fin) {
  const h = Math.floor(n / 100), r = n % 100; let s = '';
  if (h) s = h === 1 ? 'cent' : U[h] + ' cent' + (!r && fin ? 's' : '');
  if (r) s += (s ? ' ' : '') + l99(r, fin);
  return s;
}
function entierLettres(n) {
  if (!n) return 'zéro';
  const g = Math.floor(n / 1e9), m = Math.floor(n / 1e6) % 1000, k = Math.floor(n / 1000) % 1000, r = n % 1000, s = [];
  if (g) s.push(l999(g, true) + ' milliard' + (g > 1 ? 's' : ''));
  if (m) s.push(l999(m, true) + ' million' + (m > 1 ? 's' : ''));
  if (k) s.push(k === 1 ? 'mille' : l999(k, false) + ' mille');
  if (r) s.push(l999(r, true));
  return s.join(' ');
}
function enLettres(v) {
  const neg = v < 0; v = Math.abs(r2(v));
  let e = Math.floor(v + 1e-9), c = Math.round((v - e) * 100);
  if (c === 100) { e++; c = 0; }
  const deEuros = e >= 1e6 && e % 1e6 === 0;
  let s = entierLettres(e) + (deEuros ? ' d’euros' : ' euro' + (e > 1 ? 's' : ''));
  if (c) s += ' et ' + entierLettres(c) + ' centime' + (c > 1 ? 's' : '');
  s = (neg ? 'moins ' : '') + s;
  return s.charAt(0).toUpperCase() + s.slice(1);

/* couleur du stylo de chaque variante : détectée sur l'image (pixels noirs/gris vs bleus), corrigeable à la main */
const ENCRE=new Map();
function detecterEncre(u){if(ENCRE.has(u))return;ENCRE.set(u,null);const img=new Image();img.onload=()=>{try{const r=Math.min(1,240/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*r)),h=Math.max(1,Math.round(img.height*r));const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);const D=x.getImageData(0,0,w,h).data;let n=0,b=0;for(let i=0;i<D.length;i+=4){if(D[i+3]<128)continue;const R=D[i],G=D[i+1],B=D[i+2];if(Math.abs(R-B)<30&&Math.abs(G-B)<30&&Math.max(R,G,B)<190)n++;else if(B>R+40)b++}ENCRE.set(u,n>0.1*b&&n>8?'noir':'bleu');render()}catch(e){ENCRE.set(u,'bleu')}};img.src=u}
function encreVar(s,kind,j){const f=kind==='tampons'?'encT':'encV';const m=s[f]&&s[f][j];if(m)return m;const u=s[kind][j];if(!ENCRE.has(u))detecterEncre(u);return ENCRE.get(u)||'?'}
const stylo=()=>(S.visa&&S.visa.stylo)||'bleu';
function varsStylo(s,kind){const L=s[kind].map((u,j)=>j);const st=stylo();const P=L.filter(j=>{const e=encreVar(s,kind,j);return e===st||e==='?'});return (P.length?P:L).map(j=>s[kind][j])}
function choixVar(kind,k){const s=sigActif();if(!s||!s[kind].length)return null;const L=s[kind].map((u,j)=>j);const st=stylo();const pool=L.filter(j=>{const e=encreVar(s,kind,j);return e===st||e==='?'});const P=pool.length?pool:L;return s[kind][P[Math.abs(k|0)%P.length]]}
const varTampon=k=>choixVar('tampons',k);
const varVu=k=>choixVar('vus',k);

 for await(const [nm,hd] of PART.dir.entries()){if(hd.kind!=='file')continue;

function setP(o,p,v){const k=p.split('.');let x=o;for(let i=0;i<k.length-1;i++){if(x[k[i]]==null)x[k[i]]={};x=x[k[i]]}x[k[k.length-1]]=v}

function libSet(nom,mois,v){if(nom&&mois&&v!=='')S.lib[nom+'|'+mois]=v}
function libGet(nom,mois){const k=nom+'|'+mois;return S.insee&&S.insee[k]!=null?S.insee[k]:S.lib[k]}
function autofill(a){const P=a.prix;P.termes.forEach(k=>{if((k.i0===''||k.i0==null)&&libGet(k.nom,P.mo)!=null)k.i0=libGet(k.nom,P.mo)});

function alertes(a,R,o){const out=[];const M=num(a.montantMarche)+num(a.avenants),lab=a.typeMarche==='bc'?'du BC':'du marché';
 if(M){const p=o.cumTot.base/M*100,s=num(a.seuil)||85;
  if(p>100)out.push(['warn',`Cumul à ${nb(p,1)} % ${lab} : dépassement du montant`]);
  else if(p>=s)out.push(['warn',`Cumul à ${nb(p,1)} % ${lab} : seuil de ${nb(s,0)} % franchi`]);
  else out.push(['ok',`${nb(p,1)} % ${lab} — marge avant ${nb(s,0)} % : ${eur(M*s/100-o.cumTot.base)} HT`])}
 const sumST=a.intervenants.filter(i=>i.type!=='titulaire').reduce((x,i)=>x+num(i.montant),0);
 a.intervenants.forEach(it=>{const c=o.cum[it.id].base,l=o.lignes[it.id];
  if(it.type==='titulaire'){if(M&&c>M-sumST+0.004)out.push(['warn',`${it.nom||'Titulaire'} : cumul supérieur à la dépense autorisée (${eur(M-sumST)})`])}
  else{if(num(it.montant)&&c>num(it.montant)+0.004)out.push(['warn',`${it.nom} : cumul ${eur(c)} supérieur au montant sous-traité (${eur(num(it.montant))})`]);
   if(l.base&&(it.statut||'Accepté')!=='Accepté')out.push(['warn',`${it.nom} : facture sans sous-traitance acceptée (${it.statut})`])}
  if(l.cert&&!it.iban)out.push(['',`${it.nom||'?'} : IBAN non renseigné`])});
 try{const C=calcOS(a.os||[]);if(o.d&&o.d.mois)out.push(...controleMoisOS(C,o.d.mois,{achevement:penaliteInfo(a).ach}));const I=penaliteInfo(a);if(o.d&&o.d.solde&&I.montant&&!num(o.d.penalites))out.push(['warn',`Pénalités de retard calculées : ${I.jours} jours × ${eur(I.taux)} = ${eur(I.montant)} — non reportées sur ce décompte de solde`])}catch(x){}
 return out}

const loadJS=src=>new Promise((ok,ko)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>ko(new Error('Chargement impossible (connexion internet requise) : '+src));document.head.appendChild(s)});
const PDFJS='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/';
let pdfjsP=null;
function pdfjs(){if(!pdfjsP)pdfjsP=import(PDFJS+'pdf.min.mjs').then(m=>{m.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.mjs';return m}).catch(e=>{pdfjsP=null;throw new Error('Lecture PDF indisponible (connexion internet requise)')});return pdfjsP}
async function pdfOuvrir(file){const L=await pdfjs();return L.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise}
async function pdfLignes(file,doc){doc=doc||await pdfOuvrir(file);const out=[];
 for(let p=1;p<=doc.numPages;p++){const tc=await(await doc.getPage(p)).getTextContent();const rows={};
  tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=Math.round(it.transform[5]/3)*3;(rows[y]=rows[y]||[]).push({x:it.transform[4],s:it.str})});
  Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>out.push({p,t:rows[y].sort((a,b)=>a.x-b.x).map(r=>r.s).join('  ').replace(/\s{3,}/g,'   ')}))}
 return out}

async function texteDe(file,prog){

  if(txt.replace(/\s/g,'').length>80*doc.numPages/3)return txt;
  const w=await ocrWorker();let all='';
  for(let p=1;p<=doc.numPages;p++){prog&&prog(`Reconnaissance du texte, page ${p}/${doc.numPages}…`);const pg=await doc.getPage(p);const vp=pg.getViewport({scale:2.2});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
   await pg.render({canvas:c,canvasContext:c.getContext('2d'),viewport:vp}).promise;const r=await w.recognize(c);all+=r.data.text+'\n'}
  return all}
 prog&&prog('Reconnaissance du texte de l\'image…');const w=await ocrWorker();const r=await w.recognize(file);return r.data.text}

 document.body.appendChild(o);const c=o.querySelector('#sgC'),x=c.getContext('2d');let vide=true,pt=null;

const KW=/(total|montant|situation|mois|cumul|pr[ée]c[ée]dent|ant[ée]rieur|h\.?\s?t|net|travaux)/i;

function importSituation(n){const inp=document.createElement('input');inp.type='file';inp.accept='.pdf';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;
 modal('Lecture de la situation…','<p>Analyse du PDF en cours…</p>');
 try{const L=await pdfLignes(f);const a=A();const d=a.decomptes[n];
  const avec=L.map((l,j)=>({...l,j,m:montantsDans(l.t)})).filter(l=>l.m.length);
  if(!avec.length){modal('Situation : '+esc(f.name),'<p>Aucun montant lisible : ce PDF est probablement scanné (image). Saisis le montant à la main.</p>');return}
  const opts=a.intervenants.map(it=>`<option value="${it.id}">${it.type==='titulaire'?'Titulaire':'S-T'} ${esc(it.nom)}</option>`).join('');
  const prevCum=it=>a.decomptes.slice(0,n).reduce((s,x)=>s+num(x.montants&&x.montants[it]),0);
  const body=`<p class="hint">Clique sur un montant pour le reporter sur le décompte n° ${esc(d.num)}. Les lignes surlignées contiennent un mot-clé (total, mois, cumul, HT…).</p>
  <div class="row" style="margin-bottom:10px"><label class="f" style="flex-direction:row;align-items:center;gap:8px">Affecter à <select id="impI">${opts}</select></label>
  <label class="f" style="flex-direction:row;align-items:center;gap:8px">Le montant cliqué est <select id="impM"><option value="cumul"${a.saisie==='cumul'?' selected':''}>le cumul HT</option><option value="mois"${a.saisie!=='cumul'?' selected':''}>le montant HT du mois</option></select></label>
  <label class="row" style="gap:6px;font-size:13px"><input type="checkbox" id="impK" checked> Lignes à mots-clés seulement</label></div>
  <div id="impL">${avec.map(l=>`<div class="pdfl${KW.test(l.t)?' k':''}" data-k="${KW.test(l.t)?1:0}"><span class="pill">p.${l.p}</span><span class="tx">${esc(l.t)}</span>${l.m.map(v=>`<button class="amt" data-v="${v}">${nb(v)}</button>`).join('')}</div>`).join('')}</div>`;
  const ov=modal('Situation : '+esc(f.name),body);
  const filt=()=>ov.querySelectorAll('.pdfl').forEach(r=>r.style.display=$('#impK').checked&&r.dataset.k==='0'?'none':'');filt();$('#impK').onchange=filt;
  ov.querySelector('#impL').addEventListener('click',e=>{const b=e.target.closest('.amt');if(!b)return;const it=$('#impI').value;let v=+b.dataset.v;
   const enCumul=$('#impM').value==='cumul';d.montants=d.montants||{};
   if(a.saisie==='cumul'){if(!enCumul)v=r2(v+(calc(a).rows[n].ant[it].base||0))}else if(enCumul)v=r2(v-prevCum(it));
   d.montants[it]=v;save();
   toast(`${nb(v)} € reporté sur le décompte n° ${d.num}`);b.style.background='#13795b';b.style.color='#fff'});
  ov.querySelector('footer').insertAdjacentHTML('afterbegin','<button class="btn pri" id="impOk">Terminer</button>');$('#impOk').onclick=()=>{closeModal();render()};
 }catch(x){modal('Lecture impossible',`<p>${esc(x.message||x)}</p>`)}};inp.click()}

function blanchir(file){return new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext('2d');x.drawImage(im,0,0);
 const d=x.getImageData(0,0,c.width,c.height),p=d.data;let x0=c.width,y0=c.height,x1=0,y1=0;
 for(let i=0;i<p.length;i+=4){const m=Math.min(p[i],p[i+1],p[i+2]);if(m>215)p[i+3]=0;else{if(m>170)p[i+3]=Math.round((215-m)/45*255);const k=i/4,xx=k%c.width,yy=(k/c.width)|0;if(xx<x0)x0=xx;if(yy<y0)y0=yy;if(xx>x1)x1=xx;if(yy>y1)y1=yy}}
 x.putImageData(d,0,0);if(x1<=x0){ok(c.toDataURL('image/png'));return}
 const o=document.createElement('canvas');const cw=x1-x0+1,ch=y1-y0+1,r=Math.min(1,700/cw);o.width=Math.round(cw*r);o.height=Math.round(ch*r);o.getContext('2d').drawImage(c,x0,y0,cw,ch,0,0,o.width,o.height);ok(o.toDataURL('image/png'))};im.onerror=()=>ko(new Error('Image illisible'));im.src=r.result};r.readAsDataURL(file)})}
